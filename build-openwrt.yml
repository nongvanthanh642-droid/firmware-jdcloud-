name: Build Full IoT OpenWrt for JD Cloud AX1800 Pro

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  REPO_BRANCH: openwrt-23.05
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Install Build Tools
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          subversion swig time libelf-dev ecj fastjar libelf1 libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libreadline-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch \
          pkgconf python3 python3-pip python3-ply python3-docutils qemu-utils re2c scons squashfs-tools \
          uglifyjs upx-ucl binfmt-support
        sudo timedatectl set-timezone "$TZ"

    - name: Clone ImmortalWrt Source
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_ROOT=$PWD" >> $GITHUB_ENV

    - name: Update & Install ImmortalWrt Feeds
      run: |
        cd openwrt
        [ -f ../$DIY_P1_SH ] && chmod +x ../$DIY_P1_SH && ../$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure AX1800 Pro & All Requested Packages (Bilingual VI + EN)
      run: |
        cd openwrt
        [ -f ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config
        [ -f ../$DIY_P2_SH ] && chmod +x ../$DIY_P2_SH && ../$DIY_P2_SH
        make defconfig

    - name: Inject 64GB eMMC Auto-Expand Script
      run: |
        cd openwrt
        mkdir -p files/etc/uci-defaults
        [ -f ../99-expand-emmc.sh ] && cp ../99-expand-emmc.sh files/etc/uci-defaults/
        [ -f ../98-custom-settings.sh ] && cp ../98-custom-settings.sh files/etc/uci-defaults/
        chmod +x files/etc/uci-defaults/* 2>/dev/null || true

    - name: Download Sources
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware (Qualcomm IPQ6000)
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Package Firmware Files
      id: package
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "STATUS=success" >> $GITHUB_OUTPUT
        echo "DANH SÁCH FILE FIRMWARE ĐÃ TẠO:"
        ls -la

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.package.outputs.STATUS == 'success' && !cancelled()
      with:
        name: ImmortalWrt_JDCloud_AX1800Pro_64GB_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}/*
        retention-days: 30

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.package.outputs.STATUS == 'success' && !cancelled()
      with:
        tag_name: JDCloud-AX1800Pro-${{ env.FILE_DATE }}
        name: Firmware JD Cloud AX1800 Pro 64GB eMMC (Bilingual VI + 4G IoT)
        body: |
          ### Firmware ImmortalWrt cho JD Cloud AX1800 Pro
          - Chip: Qualcomm IPQ6000 (qualcommax/ipq60xx)
          - Bộ nhớ: Đã tích hợp script tự động mở rộng 64GB eMMC (~58GB trống)
          - Giao diện: Song ngữ Tiếng Việt + Tiếng Anh (Theme Argon)
          - 4G LTE: Khóa băng tần luci-app-modemband, Khóa trạm BTS atinout, Đọc SMS OTP
          - Proxy: NekoBox (Sing-box) + AdGuard Home
          - IoT: Docker, Dockerman, Tailscale
        files: ${{ env.FIRMWARE }}/*sysupgrade.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
