name: Build OpenWrt for JD Cloud AX1800 Pro (64GB eMMC + 4G IoT)

on:
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt branch'
        required: true
        default: 'openwrt-23.05'

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: ${{ github.event.inputs.openwrt_branch || 'openwrt-23.05' }}
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android 2>/dev/null || true
        sudo rm -rf /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
        sudo -E apt-get -qq update
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        df -h

    - name: Initialize Compilation Environment
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          subversion swig time libelf-dev ecj fastjar libelf1 libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libreadline-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch \
          pkgconf python3 python3-pip python3-ply python3-docutils qemu-utils re2c scons squashfs-tools \
          uglifyjs upx-ucl binfmt-support
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Official OpenWrt Source
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        echo "OPENWRT_ROOT=$PWD/openwrt" >> $GITHUB_ENV

    - name: Update & Install Feeds (Auto-pass errors)
      run: |
        cd openwrt
        ./scripts/feeds update -a || true
        ./scripts/feeds install -a || true

        # Clone truc tiep cac package vao package/ de khong bao gio bi loi feed
        git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon || true
        git clone --depth 1 https://github.com/4fun/luci-app-modemband.git package/luci-app-modemband || true
        git clone --depth 1 https://github.com/koshev-ay/luci-app-sms-tool.git package/luci-app-sms-tool || true

    - name: Generate Defconfig for AX1800 Pro & 64GB eMMC
      run: |
        cd openwrt
        cat << 'EOF' > .config
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq60xx=y
        CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y
        CONFIG_TARGET_ROOTFS_PARTSIZE=1024
        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_PACKAGE_parted=y
        CONFIG_PACKAGE_gdisk=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_lsblk=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_resize2fs=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_usb-modeswitch=y
        CONFIG_PACKAGE_modemmanager=y
        CONFIG_PACKAGE_luci-app-modemmanager=y
        CONFIG_PACKAGE_atinout=y
        CONFIG_PACKAGE_picocom=y
        CONFIG_PACKAGE_luci-app-modemband=y
        CONFIG_PACKAGE_luci-app-sms-tool=y
        CONFIG_PACKAGE_mwan3=y
        CONFIG_PACKAGE_luci-app-mwan3=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_dockerd=y
        CONFIG_PACKAGE_docker=y
        CONFIG_PACKAGE_docker-compose=y
        CONFIG_PACKAGE_tailscale=y
        CONFIG_PACKAGE_mosquitto-ssl=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-i18n-base-vi=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget-ssl=y
        EOF
        make defconfig

    - name: Inject 64GB eMMC Auto-Expand Script
      run: |
        mkdir -p openwrt/files/etc/uci-defaults
        cat << 'EOF' > openwrt/files/etc/uci-defaults/99-expand-emmc.sh
        #!/bin/sh
        FLAG_FILE="/etc/emmc_expanded.done"
        if [ -f "$FLAG_FILE" ]; then exit 0; fi
        ROOT_DEV="/dev/mmcblk0"
        if [ ! -b "$ROOT_DEV" ]; then exit 0; fi
        PART_NUM=$(grep -E 'rootfs_data|rootfs' /proc/mtd /proc/partitions 2>/dev/null | awk '{print $4}' | grep -o '[0-9]*$' | tail -n 1)
        parted -s "$ROOT_DEV" print ---pretend-input-tty <<FIX
        Fix
        FIX
        if [ -n "$PART_NUM" ]; then
            parted -s "$ROOT_DEV" resizepart "$PART_NUM" 100%
        fi
        partx -u "$ROOT_DEV" 2>/dev/null || blockdev --rereadpt "$ROOT_DEV" 2>/dev/null
        resize2fs "${ROOT_DEV}p${PART_NUM}" 2>/dev/null || resize2fs /dev/root 2>/dev/null
        mkdir -p /opt/docker /opt/bms-gateway
        touch "$FLAG_FILE"
        exit 0
        EOF
        chmod +x openwrt/files/etc/uci-defaults/99-expand-emmc.sh

    - name: Download Dependencies
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware (Qualcomm IPQ6000)
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize Artifacts
      id: organize
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "STATUS=success" >> $GITHUB_OUTPUT

    - name: Upload Sysupgrade .bin to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.STATUS == 'success'
      with:
        name: OpenWrt_JDCloud_AX1800Pro_64GB_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}/*sysupgrade.bin
        retention-days: 30
