name: Build OpenWrt AX1800Pro Rock Solid

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Dọn dẹp ổ đĩa triệt để (Tạo 50GB+ dung lượng trống)
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d/*
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev libncurses-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          df -h

      - name: 2. Tải mã nguồn OpenWrt (LEDE) & Các gói ngoài
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt
          
          # Clone trực tiếp các package ngoài vào package/custom (Tránh lỗi feed không nhận diện)
          mkdir -p package/custom
          git clone --depth 1 https://github.com/4IceG/luci-app-modemband.git package/custom/luci-app-modemband
          git clone --depth 1 https://github.com/4IceG/luci-app-sms-tool.git package/custom/luci-app-sms-tool
          git clone --depth 1 https://github.com/Thannhub/luci-app-nekobox.git package/custom/luci-app-nekobox
          git clone --depth 1 https://github.com/rufengsuixing/luci-app-adguardhome.git package/custom/luci-app-adguardhome

      - name: 3. Cập nhật Feeds & Nạp Go Runtime mới nhất (Fix lỗi Sing-box/Docker)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          
          # Nạp Go 23.x chuyên dụng cho Docker / Sing-box
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 23.x feeds/packages/lang/golang
          
          ./scripts/feeds install -a

      - name: 4. Nạp cấu hình gói chuẩn (.config)
        run: |
          cd openwrt
          cat << 'EOF' > .config
          # Chipset Qualcomm IPQ6000 - JD Cloud AX1800 Pro
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y

          # Giao diện tiếng Việt & Theme Argon
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-i18n-argon-vi=y

          # 1. Driver USB Tethering (Android + iPhone)
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-ipheth=y
          CONFIG_PACKAGE_usbmuxd=y
          CONFIG_PACKAGE_libimobiledevice=y

          # 2. Driver & Quản lý Modem 4G/5G
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_mobile-broadband-provider-info=y

          # 3. Quản lý sóng: Khoá Band, Khoá Cell PCI, SMS OTP
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_luci-app-sms-tool=y
          CONFIG_PACKAGE_atinout=y
          CONFIG_PACKAGE_picocom=y

          # 4. Quản lý ổ đĩa, 64GB eMMC & File system
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_f2fs-tools=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_ntfs-3g=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-diskman=y

          # 5. Tối ưu bộ nhớ: zRAM chống tràn RAM 512MB
          CONFIG_PACKAGE_kmod-zram=y
          CONFIG_PACKAGE_zram-swap=y

          # 6. Cân bằng tải Đa WAN & Giám sát băng thông
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          # 7. Docker CE
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_cgroupfs-mount=y

          # 8. Mạng Mesh VPN & Smart Home
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_mosquitto-ssl=y

          # 9. Bảo mật, AdGuard Home & NekoBox (Sing-box)
          CONFIG_PACKAGE_luci-app-nekobox=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipset=y

          # 10. Tiện ích quản trị & Tăng tốc mạng
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_zoneinfo-asia=y
          EOF

          make defconfig

      - name: 5. Tạo Script tự động nhận diện USB Tethering & bung eMMC an toàn
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          mkdir -p openwrt/files/etc/sysctl.d
          
          # Cấu hình Swappiness an toàn cho eMMC
          echo "vm.swappiness=10" > openwrt/files/etc/sysctl.d/99-custom.conf

          cat << 'EOF' > openwrt/files/etc/uci-defaults/99-init-ax1800pro.sh
          #!/bin/sh

          # 1. Tự động nhận diện mạng USB từ Android (usb0) và iPhone (eth1)
          uci -q get network.tethering_android >/dev/null || {
              uci set network.tethering_android=interface
              uci set network.tethering_android.proto='dhcp'
              uci set network.tethering_android.device='usb0'
          }
          uci -q get network.tethering_iphone >/dev/null || {
              uci set network.tethering_iphone=interface
              uci set network.tethering_iphone.proto='dhcp'
              uci set network.tethering_iphone.device='eth1'
          }
          uci commit network

          # Gán vào WAN Firewall zone
          WAN_ZONE=$(uci show firewall | grep '=zone' | grep "name='wan'" | cut -d'.' -f2 | cut -d'=' -f1)
          [ -n "$WAN_ZONE" ] && {
              uci add_list firewall.${WAN_ZONE}.network='tethering_android'
              uci add_list firewall.${WAN_ZONE}.network='tethering_iphone'
              uci commit firewall
          }

          # 2. Bung eMMC 64GB an toàn (Hỗ trợ chuẩn xác cả EXT4 và F2FS)
          TARGET_DEV=$(grep ' /overlay ' /proc/mounts | awk '{print $1}')
          [ -z "$TARGET_DEV" ] && TARGET_DEV=$(df /overlay 2>/dev/null | grep '/dev/mmcblk' | awk '{print $1}')

          case "$TARGET_DEV" in
              /dev/mmcblk0p*)
                  DISK="/dev/mmcblk0"
                  PART_NUM=$(echo "$TARGET_DEV" | grep -o '[0-9]*$')
                  
                  # Mở rộng partition lên 100% ổ eMMC
                  parted -s "$DISK" resizepart "$PART_NUM" 100% 2>/dev/null
                  partx -u "$TARGET_DEV" 2>/dev/null

                  # Mở rộng filesystem tương ứng
                  FS_TYPE=$(grep ' /overlay ' /proc/mounts | awk '{print $3}')
                  if [ "$FS_TYPE" = "ext4" ]; then
                      resize2fs "$TARGET_DEV"
                  elif [ "$FS_TYPE" = "f2fs" ]; then
                      resize.f2fs "$TARGET_DEV"
                  fi
                  ;;
          esac

          # 3. Trỏ đường dẫn lưu Docker về eMMC
          mkdir -p /opt/docker
          uci -q get dockerd.globals >/dev/null || uci set dockerd.globals='globals'
          uci set dockerd.globals.data_root='/opt/docker'
          uci commit dockerd

          exit 0
          EOF
          chmod -R 755 openwrt/files

      - name: 6. Tải trước gói phụ thuộc (Download dl)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 7. Tiến hành Compile (Tự động chống treo luồng)
        run: |
          cd openwrt
          echo -e "$(nproc) threads compile..."
          make -j$(nproc) || make -j1 V=s

      - name: 8. Xuất file ROM lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_AX1800Pro_RockSolid
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*.bin
            openwrt/bin/targets/qualcommax/ipq60xx/*.manifest
