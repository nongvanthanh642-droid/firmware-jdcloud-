name: JDC-AX1800Pro-Build

on:
  workflow_dispatch:

permissions: write-all

env:
  # DÙNG KHO MÃ NGUỒN CỦA VIKINGYFY - ĐÃ CÓ SẴN DRIVER CHO JD CLOUD AX1800 PRO EMMC
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: owrt
  TZ: Asia/Ho_Chi_Minh

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. GỘP ĐĨA 45GB
    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 4096
        temp-reserve-mb: 100
        root-reserve-mb: 2048

    # 2. CÀI MÔI TRƯỜNG
    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get -qq update
        sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget parted
        sudo timedatectl set-timezone "$TZ"

    # 3. TẢI MÃ NGUỒN CHUẨN AX1800 PRO
    - name: Clone Source Code
      run: |
        git clone -b $REPO_BRANCH --single-branch --depth 1 $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    # 4. UPDATE FEEDS
    - name: Update Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # 5. NẠP CẤU HÌNH ÉP CHẶT QUALCOMM IPQ6000 AX1800 PRO
    - name: Load Full Configuration
      run: |
        cd $OPENWRT_PATH
        # Xóa sạch bất kỳ file cấu hình cũ nào
        rm -rf .config*
        
        cat << 'EOF' > .config
        # BẮT BUỘC QUALCOMM IPQ6000 - KHÔNG ĐƯỢC CHẠY X86
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq60xx=y
        CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y

        # MODEM 4G LTE, KHÓA TRẠM BTS, KHÓA BAND & USB MODESWITCH
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_usb-modeswitch=y
        CONFIG_PACKAGE_uqmi=y
        CONFIG_PACKAGE_atinout=y
        CONFIG_PACKAGE_sms-tool=y
        CONFIG_PACKAGE_luci-app-modemband=y
        CONFIG_PACKAGE_comgt=y

        # MẠNG & CHỨNG CHỈ SSL
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_ca-certificates=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_kmod-tun=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y
        CONFIG_PACKAGE_ipset=y

        # QUẢN LÝ 64GB EMMC
        CONFIG_PACKAGE_parted=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_resize2fs=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_kmod-fs-ext4=y

        # GIAO DIỆN TIẾNG VIỆT & ARGON
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-i18n-base-vi=y
        CONFIG_PACKAGE_luci-i18n-firewall-vi=y
        EOF

        make defconfig
        echo "=== XÁC MINH TARGET CHÍNH XÁC ==="
        grep -E "CONFIG_TARGET_qualcommax|CONFIG_TARGET_DEVICE.*jdcloud" .config

    # 6. SCRIPT TỰ ĐỘNG MỞ RỘNG 64GB EMMC
    - name: Inject 64GB Auto-expand script
      run: |
        mkdir -p $OPENWRT_PATH/package/base-files/files/etc/uci-defaults
        cat << 'EOF' > $OPENWRT_PATH/package/base-files/files/etc/uci-defaults/99-expand-emmc
        #!/bin/sh
        if [ ! -f /etc/emmc_expanded.done ]; then
            logger -t emmc "Auto fixing GPT and expanding 64GB eMMC..."
            parted -s /dev/mmcblk0 ---pretend-input-point-at-end print Fix 2>/dev/null || true
            parted -s /dev/mmcblk0 resizepart 3 100% 2>/dev/null || true
            resize2fs /dev/mmcblk0p3 2>/dev/null || true
            touch /etc/emmc_expanded.done
        fi
        exit 0
        EOF
        chmod +x $OPENWRT_PATH/package/base-files/files/etc/uci-defaults/99-expand-emmc

    # 7. TẢI CÁC GÓI
    - name: Download packages
      run: |
        cd $OPENWRT_PATH
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    # 8. BIÊN DỊCH FIRMWARE
    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    # 9. GOM ĐÚNG FILE ROM QUALCOMM CHO AX1800 PRO
    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware_output
        find $OPENWRT_PATH/bin/targets/qualcommax/ -type f \( -name "*sysupgrade*" -o -name "*factory*" -o -name "*ubi*" \) -exec cp -f {} $GITHUB_WORKSPACE/firmware_output/ \;
        cd $GITHUB_WORKSPACE/firmware_output
        echo "=== CÁC FILE CHO JD CLOUD AX1800 PRO ĐÃ RA LÒ ==="
        ls -lh

    # 10. ĐẨY RA MỤC RELEASES
    - name: Publish to GitHub Releases
      if: steps.compile.outputs.status == 'success'
      uses: ncipollo/release-action@v1
      with:
        name: Bản Rom Chuẩn JD Cloud AX1800 Pro (Build ${{ env.FILE_DATE }})
        tag: JDC-AX1800Pro-${{ env.FILE_DATE }}-${{ github.run_number }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ github.workspace }}/firmware_output/*
        body: |
          ### 🚀 BẢN FIRMWARE CHUẨN XÁC CHO ROUTER JD CLOUD AX1800 PRO:
          - **Thiết bị:** JD Cloud AX1800 Pro (Qualcomm IPQ6000 / RE-CS-07)
          - **Tập tin:** Tải file có chữ `*jdcloud_re-cs-07*sysupgrade.bin` bên dưới để flash vào Router.
          - **Modem 4G:** Khóa BTS, Khóa Band, Only 4G, Tự nhận diện USB Modem.
          - **Bộ nhớ:** Tự động mở rộng 100% dung lượng 64GB eMMC.
          - **Giao diện:** Tiếng Việt + Argon Theme (IP: 192.168.1.1, không pass).
