name: JDC-AX1800Pro-OpenWrt-Full-4G-64GB

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: JDC-AX1800Pro
  TZ: Asia/Ho_Chi_Minh

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. GỘP Ổ CỨNG THEO CHUẨN CỦA HỌ (TẠO 45GB TRỐNG THỰC TẾ)
    - name: Combine Disks(Gộp đĩa chống tràn ổ cứng)
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 4096
        temp-reserve-mb: 100
        root-reserve-mb: 2048

    # 2. KHỞI TẠO MÔI TRƯỜNG DỌN RÁC
    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get -qq update
        sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget parted
        sudo timedatectl set-timezone "$TZ"

    # 3. CLONE MÃ NGUỒN
    - name: Clone Source Code
      run: |
        git clone -b $REPO_BRANCH --single-branch --depth 1 $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    # 4. CẬP NHẬT FEEDS VÀ NÂNG CẤP GOLANG
    - name: Update Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang -b 23.x feeds/packages/lang/golang
        ./scripts/feeds install -a

    # 5. NẠP ĐẦY ĐỦ CẤU HÌNH YÊU CẦU (4G LTE + KHÓA BTS + BAND + 64GB)
    - name: Load Custom Configuration
      run: |
        cd $OPENWRT_PATH
        rm -f .config
        cat << 'EOF' > .config
        # ĐÍNH DANH THIẾT BỊ JD CLOUD AX1800 PRO (RE-CS-07)
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq60xx=y
        CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y

        # MODEM 4G LTE, KHÓA TRẠM BTS, KHÓA BAND & USB MODESWITCH
        CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-serial-option=y
        CONFIG_PACKAGE_kmod-usb-serial=y
        CONFIG_PACKAGE_usb-modeswitch=y
        CONFIG_PACKAGE_uqmi=y
        CONFIG_PACKAGE_atinout=y
        CONFIG_PACKAGE_sms-tool=y
        CONFIG_PACKAGE_luci-app-modemband=y
        CONFIG_PACKAGE_comgt=y

        # MẠNG & TIỆN ÍCH VPN/BYPASS
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_ca-certificates=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_kmod-tun=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y
        CONFIG_PACKAGE_ipset=y

        # CÔNG CỤ NHẬN DIỆN 64GB EMMC
        CONFIG_PACKAGE_parted=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_resize2fs=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_kmod-fs-ext4=y

        # GIAO DIỆN TIẾNG VIỆT & ARGON
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_PACKAGE_luci-i18n-base-vi=y
        CONFIG_PACKAGE_luci-i18n-firewall-vi=y
        EOF
        make defconfig

    # 6. TỰ ĐỘNG CHÈN SCRIPT NHẬN TRỌN 64GB EMMC KHI BOOT
    - name: Inject 64GB Auto-expand script
      run: |
        mkdir -p $OPENWRT_PATH/package/base-files/files/etc/uci-defaults
        cat << 'EOF' > $OPENWRT_PATH/package/base-files/files/etc/uci-defaults/99-expand-emmc
        #!/bin/sh
        if [ ! -f /etc/emmc_expanded.done ]; then
            logger -t emmc "Auto fixing GPT and expanding 64GB eMMC..."
            parted -s /dev/mmcblk0 ---pretend-input-point-at-end print Fix 2>/dev/null || true
            parted -s /dev/mmcblk0 resizepart 3 100% 2>/dev/null || true
            resize2fs /dev/mmcblk0p3 2>/dev/null || true
            touch /etc/emmc_expanded.done
        fi
        exit 0
        EOF
        chmod +x $OPENWRT_PATH/package/base-files/files/etc/uci-defaults/99-expand-emmc

    # 7. TẢI CÁC GÓI DL
    - name: Download DL Package
      run: |
        cd $OPENWRT_PATH
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    # 8. BIÊN DỊCH FIRMWARE
    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    # 9. GOM TOÀN BỘ FILE THEO CÁCH CỦA NGƯỜI TA (BẤT CHẤP ĐUÔI FILE GÌ ĐỀU HỐT HẾT)
    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        rm -rf packages feeds.buildinfo version.buildinfo *kernel*
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "Danh sách file đã gom:"
        ls -lh

    # 10. TẠO THÔNG BÁO CHO MỤC RELEASE
    - name: Generate Release Info
      id: tag
      if: steps.compile.outputs.status == 'success'
      run: |
        touch release.txt
        echo '### 🚀 BẢN FIRMWARE AX1800 PRO ĐÃ ĐÓNG GÓI XONG' >> release.txt
        echo '- **Thiết bị:** JD Cloud AX1800 Pro (Qualcomm IPQ6000 / RE-CS-07)' >> release.txt
        echo '- **4G LTE:** Khóa BTS (Cell Lock), Khóa Band, Only 4G, Nhận diện USB Modem' >> release.txt
        echo '- **Bộ nhớ:** Tự động mở rộng 100% dung lượng 64GB eMMC' >> release.txt
        echo '- **Giao diện:** Tiếng Việt + Theme Argon' >> release.txt
        echo '- **Địa chỉ mặc định:** 192.168.1.1 (Không mật khẩu)' >> release.txt
        echo "release_tag=JDC-AX1800Pro-${{ env.FILE_DATE }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

    # 11. ĐẨY RA MỤC RELEASES BẰNG NCIPOLLO/RELEASE-ACTION (CHUẨN CỦA HỌ 100%)
    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: Bản Rom JD Cloud AX1800 Pro (R${{ env.DATE }})
        tag: ${{ steps.tag.outputs.release_tag }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        bodyFile: release.txt
