name: Build LibWrt RE-SS-01 with Portainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Dọn dẹp máy chủ giải phóng đĩa
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d/*
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget ca-certificates
          sudo apt-get clean

      - name: 2. Tải mã nguồn LibWrt chuyên dụng cho JDCloud
        run: |
          git clone --depth 1 https://github.com/LiBwrt/LibWrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 3. Nạp cấu hình đúng mã máy JDCloud RE-SS-01 (.config)
        run: |
          cd openwrt
          cat << 'EOF' > .config
          # Target phần cứng: ĐÚNG CHUẨN JDCloud RE-SS-01 (Arthur)
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y

          # Giao diện LibWrt & Tiếng Việt
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-i18n-argon-vi=y

          # 1. Trọn bộ Driver USB Tethering (Android + iPhone)
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-ipheth=y
          CONFIG_PACKAGE_usbmuxd=y
          CONFIG_PACKAGE_libimobiledevice=y

          # 2. Driver & Quản lý Modem 4G/5G chuyên dụng
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y

          # 3. DRIVER KẾT NỐI MẠCH ESP32 / ARDUINO QUA CỔNG USB
          CONFIG_PACKAGE_kmod-usb-serial-ch341=y
          CONFIG_PACKAGE_kmod-usb-serial-cp210x=y
          CONFIG_PACKAGE_kmod-usb-serial-ftdi=y
          CONFIG_PACKAGE_kmod-usb-acm=y

          # 4. Quản lý sóng 4G/5G: Khoá Band, Khoá Cell PCI
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_atinout=y
          CONFIG_PACKAGE_picocom=y

          # 5. Quản lý ổ đĩa, 64GB eMMC & Định dạng file
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_ntfs-3g=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-diskman=y

          # 6. Tối ưu bộ nhớ: zRAM chống tràn RAM 512MB
          CONFIG_PACKAGE_kmod-zram=y
          CONFIG_PACKAGE_zram-swap=y

          # 7. Cân bằng tải Đa WAN & Giám sát băng thông
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_nlbwmon=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          # 8. DOCKER CE ĐẦY ĐỦ
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_cgroupfs-mount=y

          # 9. Mạng Mesh VPN & Smart Home
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_mosquitto-ssl=y

          # 10. Bảo mật, AdGuard Home & Sing-box
          CONFIG_PACKAGE_luci-app-sing-box=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y

          # 11. Tiện ích quản trị & Tăng tốc mạng NSS
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_zoneinfo-asia=y
          EOF

          make defconfig

      - name: 4. Tạo Script tự bung 64GB eMMC & Cài đặt sẵn Portainer
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          mkdir -p openwrt/files/etc/hotplug.d/net

          cat << 'EOF' > openwrt/files/etc/uci-defaults/99-init-ax1800pro.sh
          #!/bin/sh

          # Tự nhận diện mạng USB từ Android (usb0) và iPhone (eth1)
          uci -q get network.tethering_android >/dev/null || {
              uci set network.tethering_android=interface
              uci set network.tethering_android.proto='dhcp'
              uci set network.tethering_android.device='usb0'
          }
          uci -q get network.tethering_iphone >/dev/null || {
              uci set network.tethering_iphone=interface
              uci set network.tethering_iphone.proto='dhcp'
              uci set network.tethering_iphone.device='eth1'
          }
          uci commit network

          uci add_list firewall.@zone[1].network='tethering_android'
          uci add_list firewall.@zone[1].network='tethering_iphone'
          uci commit firewall

          # Bung eMMC an toàn cho RE-SS-01
          DATA_DEV=$(mount | grep 'overlayfs:/overlay' | awk '{print $1}')
          [ -z "$DATA_DEV" ] && DATA_DEV=$(df /overlay 2>/dev/null | tail -n1 | awk '{print $1}')
          [ -z "$DATA_DEV" ] && DATA_DEV=$(ls /dev/mmcblk0p* 2>/dev/null | tail -n1)

          case "$DATA_DEV" in
              /dev/mmcblk0p*)
                  PART_NUM=$(echo "$DATA_DEV" | grep -o '[0-9]*$')
                  parted -s /dev/mmcblk0 print >/dev/null 2>&1
                  parted -s /dev/mmcblk0 resizepart "$PART_NUM" 100%
                  partx -u "$DATA_DEV" 2>/dev/null
                  resize2fs "$DATA_DEV" 2>/dev/null
                  ;;
          esac

          # Trỏ Docker về eMMC
          mkdir -p /opt/docker
          uci -q get dockerd.globals >/dev/null || uci set dockerd.globals='globals'
          uci set dockerd.globals.data_root='/opt/docker'
          uci commit dockerd

          # Tự động khởi chạy Portainer ngay khi có mạng
          cat << 'PORTAINER_EOF' > /etc/rc.local
          # Đợi docker khởi động xong sẽ tự kéo và chạy Portainer
          sleep 10
          if command -v docker >/dev/null 2>&1; then
              if ! docker ps -a | grep -q portainer; then
                  docker volume create portainer_data
                  docker run -d -p 9000:9000 --name=portainer --restart=always -v /var/run/docker.sock:/var/run/docker.sock -v portainer_data:/data 6053537/portainer-ce:latest
              fi
          fi
          exit 0
          PORTAINER_EOF

          exit 0
          EOF

          # Hotplug: Tự động kết nối mạng USB mượt mà
          cat << 'EOF' > openwrt/files/etc/hotplug.d/net/99-usb-tether
          #!/bin/sh
          case "$DEVICENAME" in
              usb0)
                  [ "$ACTION" = "add" ] && ifup tethering_android
                  ;;
              eth1)
                  [ "$ACTION" = "add" ] && ifup tethering_iphone
                  ;;
          esac
          EOF

          chmod -R 755 openwrt/files

      - name: 5. Tải trước các gói nguồn (Download dl)
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 6. Biên dịch Firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile..."
          make -j$(nproc) || make -j1 V=s

      - name: 7. Xuất file ROM lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt_JDCloud_RESS01_Portainer_Edition
          path: openwrt/bin/targets/qualcommax/ipq60xx/*.*
