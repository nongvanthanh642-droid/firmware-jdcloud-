name: Build ImmortalWrt AX1800 Pro (Full LTE + 64GB)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. DỌN SẠCH 35GB Ổ ĐĨA & TẠO SWAP CHỐNG ĐỨNG
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget parted
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      # 2. TẢI MÃ NGUỒN IMMORTALWRT 23.05 + KHO GÓI NEKOBOX CHÍNH XÁC
      - name: Clone ImmortalWrt & Setup Feeds
        run: |
          git clone -b openwrt-23.05 --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          
          # Thêm kho NekoBox chính chủ
          git clone --depth=1 https://github.com/Thaolga/luci-app-nekobox package/luci-app-nekobox

          ./scripts/feeds update -a
          
          # Nâng cấp golang mới để build Sing-box, AdGuard, Docker mượt mà
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 23.x feeds/packages/lang/golang
          
          ./scripts/feeds install -a

      # 3. NẠP ĐẦY ĐỦ CẤU HÌNH CHO JD CLOUD AX1800 PRO
      - name: Load Full Configuration
        run: |
          cd openwrt
          cat << 'EOF' > .config
          # ĐỊNH DANH CHUẨN XÁC ROUTER JD CLOUD AX1800 PRO
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          # Tiện ích mạng & Chứng chỉ bảo mật (Bắt buộc cho NekoBox/AdGuard)
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_curl=y

          # Modem 4G LTE, Khóa BTS, Khóa Band & Tự nhận dạng Modem USB
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_atinout=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_comgt=y

          # NekoBox (Sing-box) & Proxy TProxy
          CONFIG_PACKAGE_luci-app-nekobox=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_ipset=y

          # AdGuard Home & Docker
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_tailscale=y

          # Quản lý 64GB eMMC & Định dạng Ext4
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          # Giao diện Tiếng Việt & Theme Argon
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-i18n-firewall-vi=y
          EOF
          make defconfig

      # 4. SCRIPT TỰ SỬA GPT & MỞ RỘNG 64GB EMMC CHUẨN XÁC
      - name: Inject 64GB Auto-expand script
        run: |
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cat << 'EOF' > openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc
          #!/bin/sh
          if [ ! -f /etc/emmc_expanded.done ]; then
              logger -t emmc "Auto fixing GPT and expanding 64GB eMMC..."
              # Sửa lỗi bảng GPT ở cuối ổ đĩa
              parted -s /dev/mmcblk0 ---pretend-input-point-at-end print Fix 2>/dev/null || true
              # Mở rộng phân vùng thứ 3 lên 100% dung lượng
              parted -s /dev/mmcblk0 resizepart 3 100% 2>/dev/null || true
              resize2fs /dev/mmcblk0p3 2>/dev/null || true
              touch /etc/emmc_expanded.done
          fi
          exit 0
          EOF
          chmod +x openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc

      # 5. TẢI CÁC GÓI MÃ NGUỒN
      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # 6. BIÊN DỊCH FIRMWARE
      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # 7. GOM FILE ROM ĐÃ BIÊN DỊCH VÀO THƯ MỤC XUẤT
      - name: Prepare Files
        run: |
          mkdir -p release_firmware
          find openwrt/bin/targets/qualcommax/ipq60xx/ -type f \( -name "*sysupgrade*" -o -name "*factory*" \) -exec cp -f {} release_firmware/ \;
          echo "=== CÁC FILE FIRMWARE ĐÃ SẴN SÀNG ==="
          ls -lh release_firmware/

      # 8. XUẤT RA ARTIFACTS
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_AX1800Pro_Full_64GB
          path: release_firmware/*

      # 9. ĐẨY THẲNG RA MỤC RELEASES ĐỂ TẢI VỀ
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Rom-AX1800Pro-${{ github.run_id }}
          name: Bản Rom Full Trọn Gói AX1800 Pro 64GB (Build ${{ github.run_number }})
          body: |
            ### BẢN ROM ĐÃ ĐÓNG GÓI THÀNH CÔNG:
            - **Thiết bị:** JD Cloud AX1800 Pro (Qualcomm IPQ6000 / RE-CS-07)
            - **Tính năng:** Đầy đủ 4G LTE, Khóa BTS, Khóa Band, Only 4G, NekoBox (Sing-box), AdGuard Home, Docker và Tự mở rộng 64GB eMMC.
          files: release_firmware/*
