name: Build ImmortalWrt AX1800 Pro (FULL ALL PACKAGES)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. DỌN SẠCH 35GB Ổ CỨNG TRÁNH TRÀN BỘ NHỚ
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget parted
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      # 2. TẢI MÃ NGUỒN IMMORTALWRT 23.05 (HỖ TRỢ TỐT NHẤT CHO IPQ6000)
      - name: Clone ImmortalWrt Source
        run: |
          git clone -b openwrt-23.05 --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 3. NẠP ĐẦY ĐỦ 100% CÁC TÍNH NĂNG VÀO .CONFIG
      - name: Inject Full Features Configuration
        run: |
          cd openwrt
          cat << 'EOF' > .config
          # CHIP QUALCOMM IPQ6000 - ROUTER JD CLOUD AX1800 PRO
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y

          # 1. MODEM 4G LTE & KHÓA TRẠM BTS, KHÓA BAND
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_atinout=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_comgt=y

          # 2. NEKOBOX (SING-BOX) & PROXY ĐỊNH TUYẾN
          CONFIG_PACKAGE_luci-app-nekobox=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_kmod-ipt-tproxy=y
          CONFIG_PACKAGE_ipset=y

          # 3. ADGUARD HOME CHẶN QUẢNG CÁO & DOCKER
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_tailscale=y

          # 4. MỞ RỘNG 64GB EMMC & ĐỊNH DẠNG EXT4
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          # 5. GIAO DIỆN ARGON + TIẾNG VIỆT
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-i18n-firewall-vi=y
          EOF
          make defconfig

      # 4. NẠP SCRIPT TỰ NHẬN 64GB EMMC VÀO BẢN ROM KHI KHỞI ĐỘNG
      - name: Add 64GB Auto-expand script
        run: |
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cat << 'EOF' > openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc
          #!/bin/sh
          if [ ! -f /etc/emmc_expanded.done ]; then
              logger -t emmc "Auto expanding 64GB eMMC partition..."
              parted -s /dev/mmcblk0 resizepart 3 100%
              resize2fs /dev/mmcblk0p3
              touch /etc/emmc_expanded.done
          fi
          exit 0
          EOF
          chmod +x openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc

      # 5. TẢI CÁC GÓI MÃ NGUỒN VỀ MÁY ẢO
      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # 6. BIÊN DỊCH FIRMWARE
      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # 7. THU GOM FILE FIRMWARE
      - name: Prepare Files
        run: |
          mkdir -p release_firmware
          find openwrt/bin/targets/ -type f -name "*sysupgrade.bin" -exec cp -f {} release_firmware/ \;
          find openwrt/bin/targets/ -type f -name "*factory.bin" -exec cp -f {} release_firmware/ \;
          ls -lh release_firmware/

      # 8. XUẤT RA ARTIFACTS
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_AX1800Pro_Full_All_Packages
          path: release_firmware/*

      # 9. ĐẨY THẲNG RA MỤC RELEASES ĐỂ TẢI VỀ
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-Full-${{ github.run_id }}
          name: Bản Rom Full Trọn Gói AX1800 Pro (Build ${{ github.run_number }})
          body: |
            ### BẢN FIRMWARE ĐÃ CÀI ĐẦY ĐỦ 100% MỌI TÍNH NĂNG:
            - **Modem 4G:** atinout, sms-tool, luci-app-modemband (Khóa BTS, Khóa Band, Only 4G).
            - **NekoBox:** Sing-box core, tproxy, bypass web VN.
            - **AdGuard Home & Docker:** Đầy đủ luci-app-adguardhome + dockerman.
            - **64GB eMMC:** Tự động mở rộng phân vùng 100% dung lượng khi khởi động lần đầu.
            - **Giao diện:** Tiếng Việt + Giao diện Argon sang xịn mịn.
          files: release_firmware/*
