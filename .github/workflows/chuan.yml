name: Build ImmortalWrt AX1800 Pro (Full LTE + 64GB)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. DỌN SẠCH 35GB Ổ ĐĨA & TẠO SWAP CHỐNG ĐỨNG
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget parted
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      # 2. TẢI MÃ NGUỒN IMMORTALWRT 23.05
      - name: Clone ImmortalWrt
        run: |
          git clone -b openwrt-23.05 --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 3. NẠP CẤU HÌNH IPQ6000 AX1800 PRO
      - name: Load Full Configuration
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y

          # 4G LTE & Tự nhận dạng Modem USB
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_atinout=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_comgt=y

          # NekoBox (Sing-box) & Proxy
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_luci-app-nekobox=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_ipset=y

          # AdGuard Home & Quản lý thiết bị
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_tailscale=y

          # 64GB eMMC & Định dạng Ext4
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          # Giao diện Tiếng Việt & Argon
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-i18n-firewall-vi=y
          EOF
          make defconfig

      # 4. SCRIPT TỰ ĐỘNG MỞ RỘNG 64GB EMMC
      - name: Inject 64GB Auto-expand script
        run: |
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cat << 'EOF' > openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc
          #!/bin/sh
          if [ ! -f /etc/emmc_expanded.done ]; then
              logger -t emmc "Auto expanding 64GB eMMC partition..."
              parted -s /dev/mmcblk0 resizepart 3 100%
              resize2fs /dev/mmcblk0p3
              touch /etc/emmc_expanded.done
          fi
          exit 0
          EOF
          chmod +x openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc

      # 5. TẢI CÁC GÓI
      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # 6. BIÊN DỊCH FIRMWARE
      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # 7. QUAN TRỌNG: GOM TOÀN BỘ FILE ROM (BẤT KỂ ĐUÔI .BIN HAY .TAR)
      - name: Prepare Files
        run: |
          mkdir -p release_firmware
          cd openwrt/bin/targets/qualcommax/ipq60xx/
          # Copy tất cả các file rom ngoại trừ file kernel tạm
          find . -maxdepth 1 -type f \( -name "*.bin" -o -name "*.tar" -o -name "*.ubi" -o -name "*.img.gz" \) ! -name "*kernel*" -exec cp -f {} $GITHUB_WORKSPACE/release_firmware/ \;
          cd $GITHUB_WORKSPACE
          echo "=== CÁC FILE FIRMWARE ĐÃ TẠO THÀNH CÔNG ==="
          ls -lh release_firmware/

      # 8. XUẤT RA ARTIFACTS
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_AX1800Pro_Firmware
          path: release_firmware/*

      # 9. XUẤT RA GITHUB RELEASES (CÓ FILE ĐÍNH KÈM CHẮC CHẮN 100%)
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-Success-${{ github.run_id }}
          name: Bản Rom ImmortalWrt AX1800 Pro 64GB eMMC
          body: |
            ### BẢN ROM ĐÃ SẴN SÀNG CHO ROUTER JD CLOUD AX1800 PRO:
            - **Tải file:** Bác tải file có đuôi `*sysupgrade.bin` hoặc `*sysupgrade.tar` ở mục Assets bên dưới để nạp qua LuCI hoặc U-Boot.
            - **Tính năng:** Đã tích hợp đầy đủ Modem 4G, NekoBox, AdGuard Home và tự nhận 64GB eMMC.
          files: release_firmware/*
