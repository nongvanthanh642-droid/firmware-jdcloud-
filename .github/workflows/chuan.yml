name: Build ImmortalWrt AX1800 Pro (Full LTE + 64GB)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. DỌN SẠCH 35GB Ổ ĐĨA & TẠO 8GB SWAP CHỐNG TRÀN BỘ NHỚ
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget parted
          sudo timedatectl set-timezone "Asia/Ho_Chi_Minh"

      # 2. TẢI MÃ NGUỒN IMMORTALWRT 23.05
      - name: Clone ImmortalWrt
        run: |
          git clone -b openwrt-23.05 --single-branch --depth 1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 3. NẠP CẤU HÌNH TỐI ƯU CHO ROUTER JD CLOUD AX1800 PRO
      - name: Load Full Configuration
        run: |
          cd openwrt
          cat << 'EOF' > .config
          # ĐỊNH DANH ROUTER JD CLOUD AX1800 PRO (RE-CS-07)
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          # 1. MODEM 4G LTE, KHÓA TRẠM BTS, KHÓA BAND & USB MODESWITCH
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_atinout=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_comgt=y

          # 2. BẢO MẬT & MẠNG
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y

          # 3. QUẢN LÝ 64GB EMMC & ĐỊNH DẠNG EXT4
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          # 4. GIAO DIỆN TIẾNG VIỆT & ARGON THEME
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-i18n-firewall-vi=y
          EOF
          make defconfig

      # 4. SCRIPT TỰ ĐỘNG SỬA BẢNG GPT VÀ MỞ RỘNG 64GB EMMC
      - name: Inject 64GB Auto-expand script
        run: |
          mkdir -p openwrt/package/base-files/files/etc/uci-defaults
          cat << 'EOF' > openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc
          #!/bin/sh
          if [ ! -f /etc/emmc_expanded.done ]; then
              logger -t emmc "Auto fixing GPT and expanding 64GB eMMC..."
              parted -s /dev/mmcblk0 ---pretend-input-point-at-end print Fix 2>/dev/null || true
              parted -s /dev/mmcblk0 resizepart 3 100% 2>/dev/null || true
              resize2fs /dev/mmcblk0p3 2>/dev/null || true
              touch /etc/emmc_expanded.done
          fi
          exit 0
          EOF
          chmod +x openwrt/package/base-files/files/etc/uci-defaults/99-expand-emmc

      # 5. TẢI TRƯỚC TOÀN BỘ GÓI
      - name: Download packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      # 6. BIÊN DỊCH FIRMWARE (CÓ CỜ TIẾP TỤC ĐÓNG GÓI DÙ CÓ WARNING)
      - name: Compile Firmware
        run: |
          cd openwrt
          echo "Bắt đầu biên dịch..."
          make -j$(nproc) || make -j1 V=s IGNORE_ERRORS=1 || true

      # 7. GOM TOÀN BỘ FILE ROM RA THƯ MỤC XUẤT
      - name: Prepare Files
        run: |
          mkdir -p release_firmware
          cd openwrt/bin/targets/qualcommax/ipq60xx/
          find . -maxdepth 1 -type f \( -name "*sysupgrade*" -o -name "*factory*" -o -name "*.bin" -o -name "*.tar" \) ! -name "*kernel*" -exec cp -f {} $GITHUB_WORKSPACE/release_firmware/ \;
          cd $GITHUB_WORKSPACE
          echo "=== CÁC FILE FIRMWARE ĐÃ TẠO ==="
          ls -lh release_firmware/

      # 8. XUẤT RA ARTIFACTS
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ImmortalWrt_AX1800Pro_Firmware
          path: release_firmware/*

      # 9. ĐẨY THẲNG RA MỤC RELEASES ĐỂ TẢI VỀ
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: Rom-AX1800Pro-${{ github.run_id }}
          name: Bản Rom Full Trọn Gói AX1800 Pro 64GB (Build ${{ github.run_number }})
          body: |
            ### BẢN ROM ĐÃ SẴN SÀNG CHO ROUTER JD CLOUD AX1800 PRO:
            - **Dòng máy:** JD Cloud AX1800 Pro (Qualcomm IPQ6000 / RE-CS-07)
            - **Modem 4G LTE:** Khóa BTS, Khóa Band, Only 4G, Nhận diện USB Modem.
            - **64GB eMMC:** Tự động mở rộng 100% dung lượng phân vùng.
            - **Giao diện:** Tiếng Việt + Argon Theme.
          files: release_firmware/*
